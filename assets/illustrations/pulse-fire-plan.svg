<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" role="img" aria-label="Plan view of kettle with staggered high velocity burners"><style>
.ln{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lt{fill:none;stroke-width:1;stroke-linecap:round}
.lk{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dsh{stroke-dasharray:5 5}
.s-steel{stroke:#1E4F91}.s-soft{stroke:#8EA6CC}.s-teal{stroke:#0070AD}.s-amber{stroke:#FFB400}.s-dk{stroke:#7F9CCB}.s-dk2{stroke:#C8D6F0}
.f-teal{fill:#0070AD}.f-amber{fill:#FFB400}.f-steel{fill:#1E4F91}.f-zinc{fill:#E6F6FA}.f-white{fill:#FFFFFF}.f-ink{fill:#0A1F4D}.f-soft{fill:#C9D6EA}
.lbl{font-family:'Archivo',sans-serif;font-size:11px;font-weight:500;fill:#475A78}
.lbl-d{font-family:'Archivo',sans-serif;font-size:11px;font-weight:500;fill:#B9C8E8}
.mid{text-anchor:middle}
@keyframes run{to{stroke-dashoffset:-40}}
.wire-run{stroke-dasharray:6 14;animation:run 1.4s linear infinite}
@keyframes pulse{0%,45%{opacity:.95}50%,100%{opacity:.12}}
.pulse{animation:pulse 2.4s steps(1,end) infinite}
@keyframes melt{0%,100%{opacity:.82}50%{opacity:1}}
.melt{animation:melt 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.wire-run,.pulse,.melt{animation:none}}</style><rect x="40" y="50" width="560" height="200" class="ln s-dk"></rect><rect x="60" y="68" width="520" height="164" class="lt s-dk dsh"></rect><rect x="100" y="100" width="440" height="100" class="f-amber melt"></rect><rect x="96" y="96" width="448" height="108" class="lk s-dk2"></rect><rect x="122" y="30" width="16" height="20" class="ln s-dk"></rect><path d="M125 52 Q160 70 240 82 Q160 76 135 52 Z" class="f-amber pulse" style="animation-delay: 0s"></path><rect x="282" y="30" width="16" height="20" class="ln s-dk"></rect><path d="M285 52 Q320 70 400 82 Q320 76 295 52 Z" class="f-amber pulse" style="animation-delay: 0.8s"></path><rect x="442" y="30" width="16" height="20" class="ln s-dk"></rect><path d="M445 52 Q480 70 560 82 Q480 76 455 52 Z" class="f-amber pulse" style="animation-delay: 1.6s"></path><rect x="182" y="250" width="16" height="20" class="ln s-dk"></rect><path d="M195 248 Q160 230 80 218 Q160 224 185 248 Z" class="f-amber pulse" style="animation-delay: 0.4s"></path><rect x="342" y="250" width="16" height="20" class="ln s-dk"></rect><path d="M355 248 Q320 230 240 218 Q320 224 345 248 Z" class="f-amber pulse" style="animation-delay: 1.2s"></path><rect x="502" y="250" width="16" height="20" class="ln s-dk"></rect><path d="M515 248 Q480 230 400 218 Q480 224 505 248 Z" class="f-amber pulse" style="animation-delay: 2.0s"></path><rect x="600" y="140" width="30" height="20" class="ln s-dk"></rect><text x="320" y="154" class="lbl mid" style="fill: #0A1F4D; font-weight: 700">Kettle</text><text x="615" y="182" class="lbl-d mid">Flue</text><text x="40" y="20" class="lbl-d">Burners fire tangentially along the wall, staggered on both sides</text><text x="40" y="292" class="lbl-d">Plan view</text></svg>