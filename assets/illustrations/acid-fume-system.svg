"M520 178 H560 V10 H584 V252" class="lk s-steel"></path><path d="M566 4 q6 -8 12 0" class="ln s-soft"></path><text x="120" y="266" class="lbl mid">Enclosed pretreatment room</text><text x="332" y="64" class="lbl mid">Scrubber</text><text x="460" y="266" class="lbl mid">FRP blower</text><text x="572" y="266" class="lbl mid">Stack</text></svg>