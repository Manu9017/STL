<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 350" width="680" role="img" aria-label="Zinc kettle in a pulse-fired furnace with fume enclosure and crane"><style>
.ln{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lt{fill:none;stroke-width:1;stroke-linecap:round}
.lk{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.dsh{stroke-dasharray:5 5}
.s-steel{stroke:#1E4F91}.s-soft{stroke:#8EA6CC}.s-teal{stroke:#0070AD}.s-amber{stroke:#FFB400}.s-dk{stroke:#7F9CCB}.s-dk2{stroke:#C8D6F0}
.f-teal{fill:#0070AD}.f-amber{fill:#FFB400}.f-steel{fill:#1E4F91}.f-zinc{fill:#E6F6FA}.f-white{fill:#FFFFFF}.f-ink{fill:#0A1F4D}.f-soft{fill:#C9D6EA}
.lbl{font-family:'Archivo',sans-serif;font-size:11px;font-weight:500;fill:#475A78}
.lbl-d{font-family:'Archivo',sans-serif;font-size:11px;font-weight:500;fill:#B9C8E8}
.mid{text-anchor:middle}
@keyframes run{to{stroke-dashoffset:-40}}
.wire-run{stroke-dasharray:6 14;animation:run 1.4s linear infinite}
@keyframes pulse{0%,45%{opacity:.95}50%,100%{opacity:.12}}
.pulse{animation:pulse 2.4s steps(1,end) infinite}
@keyframes melt{0%,100%{opacity:.82}50%{opacity:1}}
.melt{animation:melt 4s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.wire-run,.pulse,.melt{animation:none}}</style><line x1="0" y1="330" x2="680" y2="330" class="ln s-dk"></line><rect x="60" y="14" width="500" height="10" class="ln s-dk"></rect><rect x="318" y="24" width="44" height="14" class="ln s-dk"></rect><line x1="340" y1="38" x2="340" y2="104" class="ln s-dk2"></line><rect x="270" y="104" width="140" height="7" class="ln s-dk2"></rect><line x1="284" y1="111" x2="296" y2="150" class="ln s-dk2"></line><line x1="396" y1="111" x2="384" y2="150" class="ln s-dk2"></line><rect x="262" y="150" width="156" height="4" class="f-soft"></rect><rect x="262" y="164" width="156" height="4" class="f-soft"></rect><rect x="262" y="154" width="156" height="10" class="ln s-dk2"></rect><path d="M176 180 V62 H250 M430 62 H504 V180" class="ln s-dk dsh"></path><path d="M504 90 H600 V60" class="ln s-dk"></path><rect x="572" y="60" width="72" height="120" rx="2" class="ln s-dk"></rect><line x1="586" y1="72" x2="586" y2="150" class="lt s-dk2"></line><line x1="604" y1="72" x2="604" y2="150" class="lt s-dk2"></line><line x1="622" y1="72" x2="622" y2="150" class="lt s-dk2"></line><path d="M586 180 L608 206 L630 180" class="ln s-dk"></path><line x1="608" y1="206" x2="608" y2="330" class="ln s-dk"></line><rect x="150" y="186" width="380" height="144" class="ln s-dk"></rect><rect x="166" y="198" width="348" height="132" class="lt s-dk dsh"></rect><rect x="204" y="206" width="272" height="96" class="f-amber melt"></rect><path d="M200 186 V305 H480 V186" class="lk s-dk2"></path><line x1="204" y1="206" x2="476" y2="206" class="ln s-amber"></line><rect x="128" y="213" width="22" height="14" rx="1" class="ln s-dk"></rect><path d="M150 215 Q176 217 196 220 Q176 223 150 225 Z" class="f-amber pulse" style="animation-delay: 0s"></path><rect x="128" y="265" width="22" height="14" rx="1" class="ln s-dk"></rect><path d="M150 267 Q176 269 196 272 Q176 275 150 277 Z" class="f-amber pulse" style="animation-delay: 1.2s"></path><rect x="530" y="213" width="22" height="14" rx="1" class="ln s-dk"></rect><path d="M530 215 Q504 217 484 220 Q504 223 530 225 Z" class="f-amber pulse" style="animation-delay: 0.6s"></path><rect x="530" y="265" width="22" height="14" rx="1" class="ln s-dk"></rect><path d="M530 267 Q504 269 484 272 Q504 275 530 277 Z" class="f-amber pulse" style="animation-delay: 1.8s"></path><path d="M500 186 V150 H540 V110" class="ln s-dk"></path><line x1="176" y1="120" x2="120" y2="120" class="lt s-dk"></line><text x="114" y="124" class="lbl-d" style="text-anchor: end">Kettle enclosure</text><line x1="150" y1="272" x2="112" y2="300" class="lt s-dk"></line><text x="106" y="312" class="lbl-d" style="text-anchor: end">Pulse-fired burners</text><text x="340" y="262" class="lbl mid" style="fill: #0A1F4D; font-weight: 700">Zinc 440–460 °C</text><text x="608" y="52" class="lbl-d mid">Bag filter</text></svg>