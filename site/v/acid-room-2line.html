function matFor(f,frp){
  const col=new THREE.Color(PAL[f]||'#8899aa');
  let map=null,rough=.62,metal=.18,emissive=0x000000,ei=0;
  if(['column','rafter','header','stc1_hanger','purlin','girt','tie','bracing','endwall_post',
      'angle','runner','cleat','pt1_plate','pt2_plate','monorail','endstop','trolley_rail'].includes(f)){map=rep(T.steel,2,2);rough=.55;metal=.42;}
  if(f==='column_frp'){map=rep(T.frp,2,3);rough=.3;metal=.06;emissive=0x00593f;ei=.3;}
  if(f==='brick'){map=rep(T.brick,7,3);rough=.95;metal=0;}
  if(['pedestal','plinth'].includes(f)){map=rep(T.conc,3,3);rough=.94;metal=0;}
  if(f==='walkway_plate'){map=rep(T.chq,20,1);rough=.6;metal=.4;}
  if(TRANSP.has(f)){map=rep(T.poly,6,3);rough=.12;metal=.05;}
  if(f==='light'){emissive=0xffe066;ei=.9;}
  const m=new THREE.MeshStandardMaterial({color:col,map:map,roughness:rough,metalness:metal,
    emissive:new THREE.Color(emissive),emissiveIntensity:ei,
    transparent:TRANSP.has(f),opacity:TRANSP.has(f)?.30:1,side:THREE.DoubleSide});
  return m;
}

const groups={},counts={},edgeSet=[];

const box=new THREE.BoxGeometry(1,1,1);
const UP=new THREE.Vector3(0,1,0);
DATA.m.forEach(m=>{
  const f=m.f;
  const mesh=new THREE.Mesh(box,matFor(f,m.frp));
  if(m.a&&m.b){
    // TRUE ORIENTED MEMBER — straight, aligned to its own axis (no stair-stepping)
    const A=new THREE.Vector3(m.a[0],m.a[2],m.a[1]);   // world Y = data z
    const Bv=new THREE.Vector3(m.b[0],m.b[2],m.b[1]);
    const dir=new THREE.Vector3().subVectors(Bv,A);
    const len=dir.length();
    mesh.scale.set(m.sz||.075,len,m.sz||.075);
    mesh.position.copy(A).addScaledVector(dir,.5);
    mesh.quaternion.setFromUnitVectors(UP,dir.clone().normalize());
  } else {
  const dx=Math.max(m.mx[0]-m.mn[0],.004), dy=Math.max(m.mx[1]-m.mn[1],.004), dz=Math.max(m.mx[2]-m.mn[2],.004);
  const cx=(m.mn[0]+m.mx[0])/2, cy=(m.mn[1]+m.mx[1])/2, cz=(m.mn[2]+m.mx[2])/2;
  mesh.scale.set(dx,dz,dy);          // world Y = data z
  mesh.position.set(cx,cz,cy);
  }
  if(!NOSHADOW.has(f)&&!TRANSP.has(f)){mesh.castShadow=true;mesh.receiveShadow=true;}
  mesh.userData={m:m,base:mesh.material};
  if(!groups[f]){groups[f]=new THREE.Group();groups[f].name=f;root.add(groups[f]);counts[f]=0;}
  groups[f].add(mesh);counts[f]++;
  {
    const e=new THREE.LineSegments(new THREE.EdgesGeometry(box),edgeMat);
    e.scale.copy(mesh.scale);e.position.copy(mesh.position);e.quaternion.copy(mesh.quaternion);
    groups[f].add(e);edgeSet.push(e);
  }
});

function cam(){
  const r=bd.dist;
  camera.position.set(bd.tx+r*Math.cos(bd.p)*Math.cos(bd.a), bd.ty+r*Math.sin(bd.p), bd.tz+r*Math.cos(bd.p)*Math.sin(bd.a));
  camera.lookAt(bd.tx,bd.ty,bd.tz);
}
cam();
cv.addEventListener('mousedown',e=>{bd.drag=true;bd.px=e.clientX;bd.py=e.clientY;bd.btn=e.button;});
addEventListener('mouseup',()=>bd.drag=false);
addEventListener('mousemove',e=>{
  if(!bd.drag)return;const dx=e.clientX-bd.px,dy=e.clientY-bd.py;bd.px=e.clientX;bd.py=e.clientY;
  if(bd.btn===2||e.shiftKey){const s=bd.dist*.0016;
    bd.tx-=Math.sin(bd.a)*dx*s*-1+0;bd.tz+=Math.cos(bd.a)*dx*s;bd.ty+=dy*s;}
  else{bd.a-=dx*.006;bd.p=Math.max(-1.45,Math.min(1.45,bd.p+dy*.006));}
  cam();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();bd.dist=Math.max(6,Math.min(260,bd.dist*(1+Math.sign(e.deltaY)*.1)));cam();},{passive:false});
let tch=null;
cv.addEventListener('touchstart',e=>{tch=e.touches.length===1?{x:e.touches[0].clientX,y:e.touches[0].clientY}:
 {d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)};},{passive:true});
cv.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&tch&&tch.x!==undefined){const dx=e.touches[0].clientX-tch.x,dy=e.touches[0].clientY-tch.y;
    tch={x:e.touches[0].clientX,y:e.touches[0].clientY};bd.a-=dx*.007;bd.p=Math.max(-1.45,Math.min(1.45,bd.p+dy*.007));cam();}
  else if(e.touches.length===2&&tch&&tch.d){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    bd.dist=Math.max(6,Math.min(260,bd.dist*(tch.d/d)));tch={d:d};cam();}},{passive:true});

/* ---------- picking ---------- */
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(),info=document.getElementById('info');
cv.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;mouse.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(root.children.filter(g=>g.visible),true).filter(h=>h.object.isMesh&&h.object.userData.m);
  if(!hits.length){info.style.display='none';return;}
  const m=hits[0].object.userData.m;
  const dx=(m.mx[0]-m.mn[0]),dy=(m.mx[1]-m.mn[1]),dz=(m.mx[2]-m.mn[2]);
  info.style.display='block';
  info.innerHTML='<div class="t">'+m.n+'</div>'+
   row('Family',LABEL[m.f]||m.f)+row('Section',m.s)+row('Scope',({OURS:'SHIVAS',CUSTOMER:'Client',BY_OTHERS:'By others'})[m.sc]||m.sc)+
   row('FRP lined',m.frp==='yes'?'YES — 2 mm acid-grade':'no')+
   row('Size (m)',dx.toFixed(3)+' × '+dy.toFixed(3)+' × '+dz.toFixed(3))+
   row('X',m.mn[0].toFixed(3)+' → '+m.mx[0].toFixed(3))+
   row('Y',m.mn[1].toFixed(3)+' → '+m.mx[1].toFixed(3))+
   row('Z',m.mn[2].toFixed(3)+' → '+m.mx[2].toFixed(3))+
   (m.nt?'<div class="r"><span class="k">'+m.nt+'</span></div>':'');
});
function row(k,v){return '<div class="r"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}

/* ---------- buttons ---------- */
const $=id=>document.getElementById(id);
$('bFrp').onclick=()=>setFrp(!frpMode);
$('bTr').onclick=()=>{transp=!transp;$('bTr').classList.toggle('on',transp);
  root.traverse(o=>{if(o.isMesh&&o.userData.m&&TRANSP.has(o.userData.m.f)){o.userData.base.opacity=transp?.08:.30;}});
  if(!frpMode)root.traverse(o=>{if(o.isMesh&&o.userData.m)o.material=o.userData.base;});};
$('bEdge').onclick=()=>{edgesOn=!edgesOn;$('bEdge').classList.toggle('on',edgesOn);
  edgeSet.forEach(e=>e.material.opacity=edgesOn?(frpMode?.14:.5):0);};
$('bSpin').onclick=()=>{spin=!spin;$('bSpin').classList.toggle('on',spin);};
$('bAll').onclick=()=>{Object.keys(groups).forEach(f=>{vis[f]=true;groups[f].visible=true;});
  document.querySelectorAll('.li').forEach(d=>d.classList.remove('off'));};
$('bSteel').onclick=()=>{const keep=new Set(['column','column_frp','rafter','header','stc1_hanger','purlin','girt',
  'tie','bracing','endwall_post','angle','runner','cleat','pt1_plate','pt2_plate']);
  Object.keys(groups).forEach(f=>{vis[f]=keep.has(f);groups[f].visible=vis[f];});
  document.querySelectorAll('.li').forEach(d=>d.classList.toggle('off',!keep.has(d.dataset.f)));};
$('bIso').onclick=()=>{bd.a=.62;bd.p=.30;bd.dist=Math.hypot(L,W)*(innerWidth<innerHeight?1.9:1.15);bd.tx=CX;bd.ty=H*.42;bd.tz=CY;cam();};
$('bTop').onclick=()=>{bd.a=-Math.PI/2;bd.p=1.42;bd.dist=Math.hypot(L,W)*(innerWidth<innerHeight?1.6:.95);bd.tx=CX;bd.ty=H*.4;bd.tz=CY;cam();};
$('bFront').onclick=()=>{bd.a=-Math.PI/2;bd.p=.06;bd.dist=Math.hypot(L,W)*(innerWidth<innerHeight?1.7:1.05);bd.tx=CX;bd.ty=H*.45;bd.tz=CY;cam();};

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);});
(function loop(){requestAnimationFrame(loop);
  if(spin){bd.a+=.0022;cam();}
  renderer.render(scene,camera);})();
(function(){let mid=null;cv.addEventListener('touchmove',e=>{if(e.touches.length!==2){mid=null;return}
 const mx=(e.touches[0].clientX+e.touches[1].clientX)/2,my=(e.touches[0].clientY+e.touches[1].clientY)/2;
 if(mid){const dx=mx-mid[0],dy=my-mid[1],s=bd.dist*.0016;bd.tx+=Math.sin(bd.a)*dx*s;bd.tz+=Math.cos(bd.a)*dx*s;bd.ty+=dy*s;cam()}mid=[mx,my]},{passive:true});
 cv.addEventListener('touchend',()=>{mid=null},{passive:true});
 if(innerWidth<=760){renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));key.shadow.mapSize.set(1024,1024);}
})();
document.getElementById('load').style.display='none';
</script><script defer src="shivas-bar.js" data-name="Enclosed acid room, two lines" data-item="acidroom" data-d="top:20px;left:50%" data-p="top:62px;right:12px"></script>
</body></html>
