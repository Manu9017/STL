<title>SHIVAS HV Furnace 6700</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; header bar on top; system tree left, inspector right (bottom sheets on phones);
   section + view tools along the bottom. Deliberately one dark theme: a model reads best on a dark ground. */
:root{
  --bg:#070C16; --stage:#0A1120; --panel:rgba(10,18,34,.94); --panel2:#111D35; --chip:#16243F; --line:#22355A;
  --text:#E7EDF9; --muted:#93A4C4; --dim:#5F7398;
  --red:#E3000F; --red2:#FF4655; --gold:#FFB400; --blue:#43A6E8;
  --pass:#4FD18B; --fail:#FF6B76; --marg:#FFC24A; --sup:#93A4C4; --info:#6EC6F0;
  --f-ui:"Archivo","Helvetica Neue",Arial,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:4px; --lw:300px; --rw:360px;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--f-ui);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
#app{position:fixed;inset:0;background:var(--stage)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;will-change:transform}
.lb span{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:2px 6px;font-size:11.5px;font-weight:600;font-stretch:90%;white-space:nowrap}
.lb span em{font-style:normal;font-family:var(--f-mono);font-size:10px;color:var(--gold);margin-right:5px}
.lb i{width:1px;height:12px;background:var(--muted)}
.lv{position:absolute;left:0;top:0;transform:translate(6px,-50%);font:500 10.5px var(--f-mono);color:var(--gold);white-space:nowrap;pointer-events:none;text-shadow:0 0 4px #000,0 0 2px #000}
.ms{position:absolute;left:0;top:0;transform:translate(-50%,-130%);background:var(--gold);color:#1A1200;font:600 11px var(--f-mono);padding:2px 7px;border-radius:3px;white-space:nowrap;pointer-events:none}

/* header */
#top{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding-block:calc(8px + env(safe-area-inset-top,0px)) 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
#top::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:3px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--gold) 33.3% 66.6%,var(--blue) 66.6%)}
.brand{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand b{font-weight:800;font-stretch:118%;letter-spacing:.06em;color:var(--red2);font-size:13px}
.brand span{font-weight:750;font-stretch:96%;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font:500 11px var(--f-mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.acts{display:flex;gap:6px;margin-left:auto;flex:none}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:6px 11px;font-weight:600;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#1A1200}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}

/* side panels */
.side{position:absolute;z-index:15;top:calc(66px + env(safe-area-inset-top,0px));bottom:64px;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;backdrop-filter:blur(10px);border-radius:var(--r)}
#left{left:max(12px,env(safe-area-inset-left,0px));width:var(--lw)}
#right{right:max(12px,env(safe-area-inset-right,0px));width:var(--rw)}
.ph{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ph .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:16px;padding:0 4px;display:none}
.pb{flex:1;overflow:auto;overscroll-behavior:contain;padding:8px 10px 14px;min-height:0}
.search{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;font-size:13px}
.sys{margin-top:6px;border-bottom:1px solid var(--line);padding-bottom:4px}
.sysh{display:grid;grid-template-columns:auto auto 1fr auto auto;gap:7px;align-items:center;padding:5px 2px}
.sysh input{margin:0;accent-color:var(--gold)}
.sw{width:11px;height:11px;border-radius:2px;border:1px solid rgba(255,255,255,.25)}
.sysh .t{font-weight:650;font-size:13px;cursor:pointer;min-width:0}
.sysh .n{font:500 10.5px var(--f-mono);color:var(--dim)}
.sysh .tw{border:0;background:none;color:var(--muted);padding:0 2px;font-size:12px;width:18px}
.plist{display:none;padding:0 0 4px 20px}
.sys.open .plist{display:block}
.pr{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:3px 4px;border-radius:3px}
.pr:hover{background:var(--chip)}
.pr[aria-current="true"]{background:rgba(255,180,0,.16)}
.pr .tg{font:600 10.5px var(--f-mono);color:var(--gold);white-space:nowrap}
.pr .nm{font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr.off .nm{color:var(--dim);text-decoration:line-through}

.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;padding:8px 2px 9px;font-weight:700;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--red)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}
.card h3{margin:2px 0 4px;font-size:18px;line-height:1.2;font-weight:750;font-stretch:94%;text-wrap:balance}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font:600 11.5px var(--f-mono);background:var(--chip);color:var(--gold);padding:2px 7px;border-radius:3px}
.pill{font:600 10.5px var(--f-mono);padding:2px 7px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-C{color:var(--pass)}.st-D{color:var(--info)}.st-A{color:var(--marg)}.st-O{color:var(--fail)}
.kv{display:grid;grid-template-columns:96px 1fr;margin-top:10px;border-top:1px solid var(--line)}
.kv dt,.kv dd{margin:0;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.kv dt{color:var(--muted);padding-right:8px}
.kv dd{min-width:0;overflow-wrap:anywhere}
.kv dd.mono{font-size:11.5px}
.note{margin-top:10px;font-size:12.5px;background:var(--panel2);border-left:3px solid var(--gold);padding:8px 10px}
.row-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sb{border:1px solid var(--line);background:var(--panel2);border-radius:var(--r);padding:5px 9px;font-size:12px;font-weight:600}
.sb:hover{border-color:var(--muted)}
.counts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.S{font:600 10.5px var(--f-mono);padding:2px 6px;border-radius:2px;white-space:nowrap}
.S.PASS{color:var(--pass);background:rgba(79,209,139,.12)}.S.FAIL{color:var(--fail);background:rgba(255,107,118,.13)}
.S.MARGINAL{color:var(--marg);background:rgba(255,194,74,.13)}.S.SUPERSEDED{color:var(--sup);background:rgba(147,164,196,.13)}.S.INFO{color:var(--info);background:rgba(110,198,240,.12)}
.ck{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.ck .v{grid-column:2;font:500 11.5px var(--f-mono);color:var(--muted)}
.ck .c{font:600 10.5px var(--f-mono);color:var(--dim)}
.dc{padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.dc b{font-family:var(--f-mono);color:var(--gold);margin-right:6px}
.dc p{margin:4px 0 0;color:var(--muted)}
.lnk{color:var(--blue)}
.filter{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.filter button{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 9px;font-size:11.5px}
.filter button[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}

/* bottom tools */
#tools{position:absolute;z-index:16;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:calc(var(--lw) + 24px);right:calc(var(--rw) + 24px);
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.grp{display:flex;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.grp button{border:0;background:none;border-radius:3px;padding:5px 9px;font-size:12px;font-weight:650;color:var(--muted);white-space:nowrap}
.grp button:hover{color:var(--text)}
.grp button[aria-pressed="true"]{background:var(--gold);color:#1A1200}
#sect{position:absolute;z-index:17;bottom:calc(58px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.srow{display:grid;grid-template-columns:28px 1fr 74px 32px;gap:8px;align-items:center;margin:4px 0}
.srow label{font:600 12px var(--f-mono);color:var(--muted)}
.srow input[type=range]{width:100%;accent-color:var(--gold)}
.srow output{font:500 11.5px var(--f-mono);text-align:right}
.srow input[type=checkbox]{accent-color:var(--gold)}
.presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
#hint{position:absolute;z-index:14;left:50%;transform:translateX(-50%);bottom:calc(58px + env(safe-area-inset-bottom,0px));font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:4px 10px;border-radius:var(--r);pointer-events:none;white-space:nowrap}
#load{position:absolute;inset:0;z-index:60;display:grid;place-items:center;background:var(--stage);transition:opacity .4s}
#load.done{opacity:0;pointer-events:none}
.ld{width:min(360px,80vw)}
.ld b{font-weight:800;font-stretch:118%;letter-spacing:.06em;color:var(--red2)}
.ld h1{margin:4px 0 12px;font-size:24px;font-weight:800;font-stretch:96%}
.ld .bar{height:3px;background:var(--line)}.ld .bar i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s}
.ld p{font:500 11.5px var(--f-mono);color:var(--muted);margin:8px 0 0}
#mtog{display:none}

@media (max-width:900px){
  :root{--lw:0px;--rw:0px}
  .meta,.acts .wide{display:none}
  .side{top:auto;bottom:0;left:0!important;right:0!important;width:auto!important;height:52%;border-radius:12px 12px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);z-index:30}
  .side[hidden]{display:none}
  .ph .x{display:block}
  #tools{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));justify-content:flex-start;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  #tools::-webkit-scrollbar{display:none}
  .grp{flex:none}
  #mtog{display:flex;gap:6px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#load{transition:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="3D model of the SHIVAS high-velocity pulse-fired furnace, kettle, dryer and heat-recovery loop. Drag to orbit, scroll or pinch to zoom, tap a part to inspect it."></canvas>

    <div class="srow"><label for="sy">Y</label><input id="sy" type="range" min="-16000" max="7000" step="10" value="0"><output id="oy" class="mono">0</output><input id="ey" type="checkbox" aria-label="Cut along Y"></div>
    <div class="srow"><label for="sz">Z</label><input id="sz" type="range" min="-2800" max="13000" step="10" value="0"><output id="oz" class="mono">0</output><input id="ez" type="checkbox" aria-label="Cut along Z"></div>

  <div id="tools">

      <button type="button" id="tSect" aria-pressed="false">Section</button>
      <button type="button" id="tFlow" aria-pressed="true">Flow</button>
      <button type="button" id="tLbl" aria-pressed="true">Labels</button>
      <button type="button" id="tLev" aria-pressed="false">Levels</button>
      <button type="button" id="tMeas" aria-pressed="false">Measure</button>
      <button type="button" id="tAll">Show all</button>

  <div id="hint">Drag to orbit · right-drag to pan · scroll to zoom · tap a part for its data</div>

  <div id="load" role="status"><div class="ld"><b>SHIVAS</b><h1>HV Furnace 6700</h1><div class="bar"><i id="ldb"></i></div><p id="ldt">Loading the model</p></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(function () {
'use strict';
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const PHONE = () => matchMedia('(max-width: 900px)').matches;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d) => typeof v === 'number' ? (Math.abs(v) >= 1000 ? v.toLocaleString('en-IN', {maximumFractionDigits: 0}) : v.toLocaleString('en-IN', {maximumFractionDigits: d ?? (Math.abs(v) >= 100 ? 1 : 2)})) : esc(v);
// CAD (mm, X east, Y north, Z up) -> three (m, x east, y up, z south)
const C2T = (p) => new THREE.Vector3(p[0] / 1000, p[2] / 1000, -p[1] / 1000);
const T2C = (v) => [v.x * 1000, -v.z * 1000, v.y * 1000];
const sanitize = n => n.replace(/\s/g, '_').replace(/[\[\]\.:\/]/g, '');

/* ---------------- renderer, scene ---------------- */
const cv = $('#cv');
const renderer = new THREE.WebGLRenderer({canvas: cv, antialias: true, powerPreference: 'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.localClippingEnabled = true;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#0A1120');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 600);
const controls = new THREE.OrbitControls(camera, cv);
controls.enableDamping = true; controls.dampingFactor = 0.085; controls.screenSpacePanning = true;
controls.maxDistance = 140; controls.minDistance = 0.5;
scene.add(new THREE.HemisphereLight(0xdbe6ff, 0x2a2420, 0.32));
const sun = new THREE.DirectionalLight(0xfff2e0, 1.15); sun.position.set(-18, 30, 22); scene.add(sun);
const fill = new THREE.DirectionalLight(0x9cc0ff, 0.35); fill.position.set(25, 12, -20); scene.add(fill);
const glowL = new THREE.PointLight(0xff7a2a, 0.0, 9, 1.8); glowL.position.set(0, 0.6, 0); scene.add(glowL);

// ground: FFL slab with a 1 m grid, opening-agnostic (transparent so pits read)
const grid = new THREE.GridHelper(60, 60, 0x2a3c62, 0x1a2944); grid.position.set(-4, 0.002, 5); grid.material.transparent = true; grid.material.opacity = 0.55; scene.add(grid);

/* ---------------- clipping planes (always 3, parked far away when off) ---------------- */
const PARK = 1e5;
const planes = [new THREE.Plane(new THREE.Vector3(-1, 0, 0), PARK), new THREE.Plane(new THREE.Vector3(0, 0, 1), PARK), new THREE.Plane(new THREE.Vector3(0, -1, 0), PARK)];

/* ---------------- materials ---------------- */
const SYSMAT = {civil: [0.95, 0.0], casing: [0.45, 0.55], lining: [0.95, 0.0], kettle: [0.35, 0.65], topclose: [0.85, 0.05], burner: [0.45, 0.35],
  gas: [0.4, 0.3], air: [0.45, 0.4], pitvent: [0.5, 0.4], instr: [0.45, 0.4], flue: [0.6, 0.3], loop: [0.5, 0.45], dryer: [0.55, 0.4], stack: [0.45, 0.55], load: [0.6, 0.4], enclosure: [0.5, 0.5]};
function perfTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  x.fillStyle = '#c9d1d8'; x.fillRect(0, 0, 128, 128); x.fillStyle = '#20262d';
  for (let j = 0; j < 4; j++) for (let i = 0; i < 4; i++) { x.beginPath(); x.arc(i * 32 + (j % 2 ? 16 : 0) + 8, j * 32 + 16, 7, 0, 7); x.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(190, 27); t.encoding = THREE.sRGBEncoding; return t;
}
function makeMat(meta) {
  const [rough, metal] = SYSMAT[meta.system] || [0.6, 0.2];
  const col = new THREE.Color().setRGB(...meta.color).convertSRGBToLinear();
  const flow = meta.layer === 'flow';
  const m = new THREE.MeshStandardMaterial({color: col, roughness: rough, metalness: metal, clippingPlanes: planes, clipShadows: true,
    side: flow ? THREE.DoubleSide : THREE.FrontSide, transparent: flow || meta.alpha < 1, opacity: meta.alpha, depthWrite: !flow, envMapIntensity: metal > 0.3 ? 0.9 : 0.45});
  if (flow) { m.emissive = col.clone(); m.emissiveIntensity = 0.55; m.roughness = 1; m.metalness = 0; }
  if (meta.tag === 'PRC-01') { m.metalness = 0.95; m.roughness = 0.18; m.emissive = new THREE.Color('#ff6a1a'); m.emissiveIntensity = 0.08; }
  if (meta.layer === 'perf') { m.map = perfTexture(); m.color.set('#ffffff'); }
  m.userData.e0 = m.emissive.clone(); m.userData.ei0 = m.emissiveIntensity;
  return m;
}
// section cap: back faces drawn flat in a darker tone, so a cut solid reads as filled
function makeBack(meta) {
  const col = new THREE.Color().setRGB(...meta.color).convertSRGBToLinear().multiplyScalar(0.42);
  return new THREE.MeshBasicMaterial({color: col, side: THREE.BackSide, clippingPlanes: planes});
}

/* ---------------- state ---------------- */
let META = {}, SYSN = {}, FLOWS = null, DATA = null;
const PART = {};         // name -> {meta, meshes:[], group, visible, box}
const SYSVIS = {};
let selected = null;
const pickables = [];

/* ---------------- loading ---------------- */
// model.glb when served (repo / local); on claude.ai the same bytes come as base64 text (glb is not a served type there)
async function fetchProgress(url, label) {
  const r = await fetch(url); if (!r.ok) throw new Error(url + ' ' + r.status);
  const total = +r.headers.get('content-length') || 0;
  if (!r.body || !total) return r;
  const rd = r.body.getReader(); const parts = []; let got = 0;
  for (;;) { const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length;
    ldb.style.width = (100 * got / total).toFixed(0) + '%'; ldt.textContent = `${label} ${(got / 1e6).toFixed(1)} / ${(total / 1e6).toFixed(1)} MB`; }
  return new Response(new Blob(parts));
}
async function loadModel() {
  try { const r = await fetch('model.glb', {method: 'HEAD'}); if (r.ok) return await (await fetchProgress('model.glb', 'Loading the model')).arrayBuffer(); } catch (e) { /* fall through */ }
  const txt = await (await fetchProgress('model.glb.b64.txt', 'Loading the model')).text();
  ldt.textContent = 'Decoding the model';
  const bin = atob(txt.replace(/\s+/g, '')); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}
const ldb = $('#ldb'), ldt = $('#ldt');
Promise.all([fetch('parts.json').then(r => r.json()), fetch('flows.json').then(r => r.json()), fetch('viewer_data.json').then(r => r.json()).catch(() => null)])
.then(([parts, flows, data]) => {
  META = parts.parts; SYSN = parts.systems; FLOWS = flows; DATA = data;
  const byS = {}; for (const k in META) byS[sanitize(k)] = k;
  loadModel().then(buf => new Promise((res, rej) => new THREE.GLTFLoader().parse(buf, '', res, rej))).then((gltf) => {
    const root = gltf.scene; root.scale.setScalar(0.001);
    const backs = [];
    root.traverse(o => {
      if (!o.isMesh) return;
      let p = o, key = null;
      while (p) { const n = (p.userData && p.userData.name) || p.name; if (META[n]) { key = n; break; } if (byS[p.name]) { key = byS[p.name]; break; } p = p.parent; }
      if (!key) return;
      const rec = PART[key] || (PART[key] = {meta: META[key], meshes: [], mat: makeMat(META[key])});
      o.material = rec.mat; o.userData.part = key; rec.meshes.push(o);
      if (META[key].layer !== 'flow') { pickables.push(o); backs.push([o, rec.back || (rec.back = makeBack(META[key]))]); }
    });
    backs.forEach(([o, m]) => { const b = new THREE.Mesh(o.geometry, m); b.renderOrder = -1; o.add(b); });
    scene.add(root);
    root.updateMatrixWorld(true);
    for (const k in PART) { const b = new THREE.Box3(); PART[k].meshes.forEach(m => b.expandByObject(m)); PART[k].box = b; }
    for (const s in SYSN) SYSVIS[s] = true;
    for (const k in PART) PART[k].on = !META[k].hidden;
    buildTree(); buildFlows(); buildLevels(); buildLabels(); applyVis(); renderPane(); go('iso', true);
    ldt.textContent = 'Ready'; $('#load').classList.add('done');
  }).catch(err => { ldt.textContent = 'The model did not load: ' + (err && err.message || err); });
}).catch(err => { ldt.textContent = 'The model data did not load: ' + err.message; });

/* ---------------- visibility ---------------- */
let showFlow = true;
function applyVis() {
  for (const k in PART) {
    const r = PART[k], m = r.meta;
    let v = r.on && SYSVIS[m.system];
    if (m.layer === 'flow') v = v && showFlow;
    r.meshes.forEach(o => o.visible = v);
  }
  $$('.pr').forEach(b => b.classList.toggle('off', !(PART[b.dataset.k]?.on)));
  if (flowGroup) flowGroup.visible = showFlow;
  flames.forEach(f => f.visible = SYSVIS.burner && showFlow);
}

/* ---------------- tree ---------------- */
function buildTree() {
  const tree = $('#tree'); tree.innerHTML = '';
  const order = Object.keys(SYSN);
  order.forEach(s => {
    const keys = Object.keys(PART).filter(k => META[k].system === s).sort();
    if (!keys.length) return;
    const c = keys.map(k => META[k].color).find(Boolean) || [0.5, 0.5, 0.5];
    const d = document.createElement('div'); d.className = 'sys'; d.dataset.s = s;
    d.innerHTML = `<div class="sysh"><button class="tw" type="button" aria-label="Show parts">▸</button><input type="checkbox" checked aria-label="Show ${esc(SYSN[s])}">
      <span class="t">${esc(SYSN[s])}</span><span class="n">${keys.length}</span><span class="sw" style="background:rgb(${c.map(v => Math.round(v * 255)).join(',')})"></span></div>
      <div class="plist">${keys.map(k => `<button class="pr" type="button" data-k="${esc(k)}"><span class="tg">${esc(META[k].tag || '')}</span><span class="nm">${esc(META[k].title)}</span></button>`).join('')}</div>`;
    const cb = d.querySelector('input');
    if (s === 'enclosure') { cb.checked = true; }
    cb.addEventListener('change', () => { SYSVIS[s] = cb.checked; applyVis(); });
    const tw = d.querySelector('.tw');
    const tog = () => { d.classList.toggle('open'); tw.textContent = d.classList.contains('open') ? '▾' : '▸'; };
    tw.addEventListener('click', tog); d.querySelector('.t').addEventListener('click', tog);
    d.querySelectorAll('.pr').forEach(b => b.addEventListener('click', () => select(b.dataset.k, true)));
    tree.appendChild(d);
  });
  $('#q').addEventListener('input', () => {
    const q = $('#q').value.trim().toLowerCase();
    $$('.sys').forEach(d => {
      let any = false;
      d.querySelectorAll('.pr').forEach(b => { const m = META[b.dataset.k]; const hit = !q || (m.tag + ' ' + m.title + ' ' + m.spec).toLowerCase().includes(q); b.hidden = !hit; any = any || hit; });
      d.hidden = !any; if (q && any) d.classList.add('open');
    });
  });
}

/* ---------------- picking ---------------- */
const ray = new THREE.Raycaster(), mv = new THREE.Vector2();
let down = null;
cv.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  const hit = pick(e); if (measuring) return measure(hit);
  select(hit ? hit.object.userData.part : null, false);
});
function pick(e) {
  const r = cv.getBoundingClientRect();
  mv.set((e.clientX - r.left) / r.width * 2 - 1, -(e.clientY - r.top) / r.height * 2 + 1);
  ray.setFromCamera(mv, camera);
  const vis = pickables.filter(o => o.visible);
  return ray.intersectObjects(vis, false).find(h => planes.every(p => p.distanceToPoint(h.point) >= -1e-4)) || null;
}

/* ---------------- measure ---------------- */
let measuring = false, mpts = [], mobj = null, mlabel = null;
const lblBox = $('#labels');
function measure(hit) {
  if (!hit) return;
  mpts.push(hit.point.clone());
  if (mpts.length > 2) mpts = [mpts[2]];
  if (mobj) { scene.remove(mobj); mobj = null; }
  if (mpts.length === 2) {
    const g = new THREE.BufferGeometry().setFromPoints(mpts);
    mobj = new THREE.Line(g, new THREE.LineBasicMaterial({color: 0xffb400, depthTest: false}));
    mobj.renderOrder = 10; scene.add(mobj);
    const a = T2C(mpts[0]), b = T2C(mpts[1]);
    const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
    if (!mlabel) { mlabel = document.createElement('div'); mlabel.className = 'ms'; lblBox.appendChild(mlabel); }
    mlabel.textContent = `${Math.round(Math.hypot(...d)).toLocaleString('en-IN')} mm · ΔX ${Math.round(d[0])} ΔY ${Math.round(d[1])} ΔZ ${Math.round(d[2])}`;
    mlabel.hidden = false;
  }
}
$('#tMeas').onclick = () => { measuring = !measuring; $('#tMeas').setAttribute('aria-pressed', measuring); mpts = []; if (!measuring) { if (mobj) scene.remove(mobj); mobj = null; if (mlabel) mlabel.hidden = true; } };

/* ---------------- flows + flames ---------------- */
let flowGroup = null; const streams = []; const flames = [];
function buildFlows() {
  flowGroup = new THREE.Group(); scene.add(flowGroup);
  const sg = new THREE.SphereGeometry(0.045, 8, 6);
  FLOWS.paths.forEach(p => {
    const v = p.pts.map(C2T); const seg = []; let L = 0;
    for (let i = 1; i < v.length; i++) { const l = v[i].distanceTo(v[i - 1]); seg.push(l); L += l; }
    const n = Math.max(4, Math.round(L / 0.32));
    const im = new THREE.InstancedMesh(sg, new THREE.MeshBasicMaterial({color: p.c, clippingPlanes: planes, transparent: true, opacity: .95}), n);
    flowGroup.add(im); streams.push({v, seg, L, n, im, sp: p.speed * 0.5});
  });
  const tmp = new THREE.Object3D();
  streams.forEach(s => setStream(s, 0, tmp));
  FLOWS.flames.forEach((f, i) => {
    const g = new THREE.Group();
    [[1.0, 1.0, '#ff3b1f', .35], [.8, .7, '#ff8c00', .5], [.55, .45, '#ffd000', .7], [.3, .25, '#fff3b0', .9]].forEach(([lf, rf, c, o]) => {
      const L = f.len / 1000 * lf, R = f.r / 1000 * rf * 1.0;
      const cone = new THREE.Mesh(new THREE.ConeGeometry(R, L, 20, 1, true), new THREE.MeshBasicMaterial({color: c, transparent: true, opacity: o, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide, clippingPlanes: planes}));
      cone.position.y = -L / 2; g.add(cone);   // tip along -y, base at the burner
    });
    const p = C2T(f.p), d = C2T([f.d[0] * 1000, f.d[1] * 1000, f.d[2] * 1000]).normalize();
    g.position.copy(p); g.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), d);
    g.userData.phase = i * Math.PI; scene.add(g); flames.push(g);
  });
}
function setStream(s, t, tmp) {
  for (let k = 0; k < s.n; k++) {
    let d = ((t * s.sp) + k * s.L / s.n) % s.L, i = 0;
    while (i < s.seg.length - 1 && d > s.seg[i]) { d -= s.seg[i]; i++; }
    tmp.position.copy(s.v[i]).lerp(s.v[i + 1], Math.min(1, d / s.seg[i])); tmp.updateMatrix(); s.im.setMatrixAt(k, tmp.matrix);
  }
  s.im.instanceMatrix.needsUpdate = true;
}

const VIEWS = {
  iso: ['Plant', [15, 17, 25], [-1.5, -0.5, 3.6]],
  furnace: ['Furnace', [7.2, 5.4, 8.6], [0, -0.7, 0]],

let anim = null;
function go(k, now) {
  const [, p, t] = VIEWS[k];
  const P = new THREE.Vector3(...p), T = new THREE.Vector3(...t);
  const asp = cv.clientWidth / Math.max(1, cv.clientHeight);
  if (asp < 0.9) P.sub(T).multiplyScalar(1.6).add(T);
  if (now || RM) { camera.position.copy(P); controls.target.copy(T); controls.update(); return; }
  anim = {p0: camera.position.clone(), t0: controls.target.clone(), p1: P, t1: T, s: performance.now()};
}
function flyToBox(b) {
  const c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3()).length();
  const dir = camera.position.clone().sub(controls.target).normalize();
  const P = c.clone().add(dir.multiplyScalar(Math.max(1.6, s * 1.25)));
  anim = {p0: camera.position.clone(), t0: controls.target.clone(), p1: P, t1: c, s: performance.now()};
  if (RM) { camera.position.copy(P); controls.target.copy(c); anim = null; }
}
const vg = $('#views');
Object.entries(VIEWS).filter(([, [l]]) => l).forEach(([k, [label]]) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = label; b.onclick = () => go(k); vg.appendChild(b); });

/* ---------------- sections ---------------- */
const S = {x: {r: $('#sx'), e: $('#ex'), o: $('#ox'), i: 0}, y: {r: $('#sy'), e: $('#ey'), o: $('#oy'), i: 1}, z: {r: $('#sz'), e: $('#ez'), o: $('#oz'), i: 2}};
function applySect() {
  const x = S.x, y = S.y, z = S.z;
  planes[0].constant = x.e.checked ? +x.r.value / 1000 : PARK;           // keep x < X  (normal -x)
  planes[1].constant = y.e.checked ? +y.r.value / 1000 : PARK;           // keep Y < Ycut (three z = -Y, normal +z)
  planes[2].constant = z.e.checked ? +z.r.value / 1000 : PARK;           // keep Z < Zcut
  for (const k in S) S[k].o.textContent = (+S[k].r.value).toLocaleString('en-IN');
}
Object.values(S).forEach(s => { s.r.addEventListener('input', () => { s.e.checked = true; applySect(); }); s.e.addEventListener('change', applySect); });
const PRE = [['A–A furnace (Y = 0)', {y: 0}, 'secA'], ['B–B west alley (X = −946)', {x: -946}, 'secB'], ['Burner axis plan (Z = −390)', {z: -390}, 'secP'],
  ['C–C dryer (Y = 0)', {y: 0}, 'secC'], ['Dryer inside (Z = −20)', {z: -20}, 'secD'], ['Loop plan (Z = −200)', {z: -200}, 'secL'], ['Clear', {}, null]];
Object.assign(VIEWS, {secA: ['', [1.6, 0.6, -7.2], [0, -0.75, 0]], secB: ['', [5.2, 0.8, -1.0], [-1.0, -0.7, 0]],
  secP: ['', [0.0, 15, 0.01], [0, -0.4, 0]], secC: ['', [-7.5, 1.2, -9.0], [-7.5, -0.7, 0]], secL: ['', [-4.5, 32, 4.01], [-4.5, -0.3, 4.0]], secD: ['', [-2.6, 5.2, 6.4], [-7.5, -1.0, 0]]});
const spre = $('#spre');
PRE.forEach(([l, s, v]) => { const b = document.createElement('button'); b.className = 'sb'; b.type = 'button'; b.textContent = l;
  b.onclick = () => { for (const k in S) { S[k].e.checked = k in s; if (k in s) S[k].r.value = s[k]; } applySect(); if (v) go(v); };
  spre.appendChild(b); });
$('#tSect').onclick = () => { const on = $('#sect').hidden; $('#sect').hidden = !on; $('#tSect').setAttribute('aria-pressed', on); $('#hint').hidden = on; };
applySect();

/* ---------------- overlay toggles ---------------- */
$('#tFlow').onclick = () => { showFlow = !showFlow; $('#tFlow').setAttribute('aria-pressed', showFlow); applyVis(); };
$('#tLbl').onclick = () => { showLbl = !showLbl; $('#tLbl').setAttribute('aria-pressed', showLbl); };
$('#tLev').onclick = () => { showLev = !showLev; $('#tLev').setAttribute('aria-pressed', showLev); if (levels.grp) levels.grp.visible = showLev; };
$('#tAll').onclick = () => { for (const k in PART) PART[k].on = !META[k].hidden || PART[k].on; for (const s in SYSVIS) SYSVIS[s] = true; $$('.sysh input').forEach(c => c.checked = true);
  for (const k in S) S[k].e.checked = false; applySect(); applyVis(); };

/* ---------------- phone panels ---------------- */
function phoneInit() { if (PHONE()) { $('#left').hidden = true; $('#right').hidden = true; } else { $('#left').hidden = false; $('#right').hidden = false; } }
$('#bSys').onclick = () => { const h = $('#left').hidden; $('#left').hidden = !h; if (h) $('#right').hidden = true; };
$('#bInfo').onclick = () => { const h = $('#right').hidden; $('#right').hidden = !h; if (h) $('#left').hidden = true; };
$$('[data-close]').forEach(b => b.onclick = () => { $('#' + b.dataset.close).hidden = true; });
phoneInit(); matchMedia('(max-width: 900px)').addEventListener('change', phoneInit);

/* ---------------- loop ---------------- */
function resize() { const w = cv.clientWidth, h = cv.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(cv); resize();
const tmp = new THREE.Object3D(); const clock = new THREE.Clock();
function frame(now) {
  const t = clock.getElapsedTime();
  if (anim) { let k = Math.min(1, (now - anim.s) / 750); k = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    camera.position.lerpVectors(anim.p0, anim.p1, k); controls.target.lerpVectors(anim.t0, anim.t1, k); if (k >= 1) anim = null; }
  if (showFlow && !RM) streams.forEach(s => setStream(s, t, tmp));
  flames.forEach((g, i) => { const hi = RM ? 1 : (Math.sin(t * Math.PI / 2.4 + g.userData.phase) > 0 ? 1 : 0.55); const fl = RM ? 1 : 1 + .05 * Math.sin(t * 17 + i * 2);
    g.scale.set(fl * (0.85 + .15 * hi), 0.55 + .45 * hi, fl * (0.85 + .15 * hi)); });
  glowL.intensity = showFlow ? 0.6 : 0;
  controls.update(); renderer.render(scene, camera); placeLabels();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
