# =====================================================================================
#  SHIVAS TECHNOLOGY LTD — HV pulse-fired galvanizing furnace + 4-position pit dryer
#  DESIGN BASIS  ·  SHV-FUR-6700  ·  Rev A  ·  2026-11-20
#
#  Single source of truth. The calculations, the CAD model, the drawings and the 3D
#  viewer all read this file; nothing downstream holds its own numbers.
#
#  Every leaf is:  [value, unit, source, status]  or  [value, unit, source, status, note]
#    source  -> key in `sources` below
#    status  -> C  confirmed in a SHIVAS source document
#               D  decided in this design (see basis/decision_register.md)
#               A  assumption, to be confirmed (see basis/open_items.md)
#               O  open / conflicting in the sources (hold)
#
#  Coordinates (mm): origin = kettle centre on plan at FFL ±0.000
#    X = east (process flow), Y = north, Z = up.   Kettle long axis = Y.
#    HDG plant model (metres, x east / z south) maps as  X = 1000(x - 45.5), Y = -1000(z - 8.5)
# =====================================================================================

meta:
  project: SHIVAS HV pulse-fired furnace and 4-position dryer, single line
  doc_no: SHV-FUR-6700-DB
  rev: A
  date: 2026-11-20
  scope: One furnace, one kettle, one dryer, one heat-recovery loop, one stack.

sources:
  RevK:  Kettle & furnace confirmed basis Rev K (as carried in the SHIVAS HDG Plant Model, 2026-10-19)
  RevH:  Furnace & dryer heat-recovery loop Rev H, with SHIVAS design check of 12 Oct 2026
  PID02: SH-PID-02 Rev M combustion P&ID (Eclipse PO STL/2026/206 gas & air scope; Bloom PO 1018 burners)
  INS:   SH-INS-01..05 Rev B ceramic-fibre insulation set + consumption reconciliation (18-19 Nov 2026)
  MB01:  SH-MB-01 Rev A mixing box, configuration S2
  DMP02: STL-MB-DMP-02 Rev A fresh-air make-up damper
  EF:    STL-EF Rev D design.py (electric furnace, same 8,200 x 2,750 envelope) - kettle support ring, casing structure, materials
  RBR:   SH-RBR-01/02 rack & pinion drive for dryer doors
  DRYN:  Dryer instrumentation notes
  HDG:   SHIVAS HDG Plant Model layout proposal (2026-10-19) - relative positions of loop equipment
  ZEN:   SHIVAS zinc fume enclosure annexure
  CBA:   Crash-barrier plant annexure (pit fan)
  THIS:  This design (SHV-FUR-6700 Rev A)

