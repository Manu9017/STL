    - [A4,  cock,   Manual cock 1½",                 DH15R50]
    - [A5,  reg,    Governor + SSOV + relief,        J125-S4]
    - [A6,  sw,     Low gas pressure switch,         DG150U-3]
    - [A7,  sw,     High gas pressure switch,        DG500U-3]
    - [A8,  gauge,  Outlet pressure gauge,           KFM250RB100]
    - [A9,  cock,   Manual cock 1½",                 DH15R50]
